<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="dino-trunk: a dinosaur with an elephant trunk">
  <!-- rounded background -->
  <rect x="2" y="2" width="124" height="124" rx="30" fill="#d3f9d8"/>

  <!-- tail -->
  <path d="M96 86 C116 76 124 92 113 101 C107 97 102 95 91 96 Z" fill="#2f9e44"/>

  <!-- body -->
  <ellipse cx="78" cy="84" rx="30" ry="24" fill="#37b24d"/>
  <path d="M56 94 Q78 111 100 94 Q78 102 56 94 Z" fill="#2f9e44" opacity="0.45"/>

  <!-- legs -->
  <rect x="64" y="100" width="11" height="20" rx="5.5" fill="#2f9e44"/>
  <rect x="86" y="100" width="11" height="20" rx="5.5" fill="#2f9e44"/>

  <!-- stegosaurus back plates -->
  <path d="M72 60 l6 -13 6 13 Z" fill="#69db7c"/>
  <path d="M86 55 l7 -14 7 14 Z" fill="#69db7c"/>
  <path d="M102 60 l6 -13 6 13 Z" fill="#69db7c"/>

  <!-- neck -->
  <path d="M58 86 C46 80 44 64 49 52 L66 58 C64 70 66 80 72 86 Z" fill="#37b24d"/>

  <!-- elephant trunk: a bold tube curling off the snout, tip curled up -->
  <path d="M50 50 C33 54 24 70 28 86 C30 95 27 103 20 106"
        fill="none" stroke="#37b24d" stroke-width="15" stroke-linecap="round"/>
  <!-- trunk rings -->
  <path d="M25 64 q8 5 3 15" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linecap="round"/>
  <path d="M23 85 q8 5 2 15" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="52" cy="46" r="16" fill="#37b24d"/>
  <!-- eye -->
  <circle cx="55" cy="42" r="5" fill="#ffffff"/>
  <circle cx="56" cy="43" r="2.4" fill="#1b3a24"/>
</svg>
